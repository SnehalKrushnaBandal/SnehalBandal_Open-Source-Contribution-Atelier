name: Auto-Assign on Self-Assign

# When a contributor comments `/assign` on an issue labeled `good-first-issue`,
# auto-assign the issue to them and add an `in-progress` label.

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Self-assign good-first-issue
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = context.payload.comment;
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (comment.body.trim().toLowerCase() !== '/assign') return;

            const hasLabel = issue.labels.some(l => l.name === 'good-first-issue');
            if (!hasLabel) return;

            if (issue.assignee) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `⚠️ This issue is already assigned to @${issue.assignee.login}.`
              });
              return;
            }

            await github.rest.issues.addAssignees({
              owner, repo, issue_number: issue.number,
              assignees: [comment.user.login]
            });

            await github.rest.issues.addLabels({
              owner, repo, issue_number: issue.number,
              labels: ['in-progress']
            });

            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `✅ Assigned to @${comment.user.login}. Good luck!`
            });