name: Stale PR Auto-Close

# Warn on PRs with no activity, then close after 14 days of inactivity.

on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Close stale PRs
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const WARN_DAYS = 7;
            const CLOSE_DAYS = 14;
            const now = new Date();

            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', sort: 'updated', direction: 'asc', per_page: 100
            });

            for (const pr of prs) {
              if (pr.draft) continue;

              const updated = new Date(pr.updated_at);
              const daysIdle = (now - updated) / (1000 * 60 * 60 * 24);

              const comments = await github.rest.issues.listComments({
                owner, repo, issue_number: pr.number, per_page: 1
              });
              const lastCommentDate = comments.data.length
                ? new Date(comments.data[0].updated_at)
                : null;

              if (daysIdle >= CLOSE_DAYS) {
                await github.rest.pulls.update({
                  owner, repo, pull_number: pr.number, state: 'closed'
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pr.number,
                  body: `🗑️ Closing this PR due to no activity for ${CLOSE_DAYS} days. ` +
                    `Reopen or ping a maintainer to revive it.`
                });
                console.log(`Closed stale PR #${pr.number}`);
              } else if (daysIdle >= WARN_DAYS) {
                // Avoid repeat warnings if we already warned recently
                const alreadyWarned = comments.data.some(c =>
                  c.user.type === 'Bot' && c.body.includes('Stale PR')
                );
                if (!alreadyWarned) {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: pr.number,
                    body: `⏳ Stale PR reminder: no activity for ${Math.floor(daysIdle)} days. ` +
                      `This will be closed automatically after ${CLOSE_DAYS} days of inactivity.`
                  });
                }
              }
            }