name: Issue Quality Check

on:
  issues:
    types: [opened, edited, labeled, unlabeled]

permissions:
  issues: write
  contents: read

jobs:
  check:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const labels = new Set(issue.labels.map(label => label.name));
            const isNsoc = labels.has('nsoc26') || labels.has('NSOC26');
            if (!isNsoc) return;
            const hasLevel = ['LEVEL1', 'LEVEL2', 'LEVEL3'].some(level => labels.has(level));
            if (hasLevel) return;
            const marker = '<!-- nsoc-quality -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, per_page: 100
            });
            if (comments.some(comment => comment.body.includes(marker))) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
              body: `${marker}\\n### ❄️ One label is still missing\\n\\nThis NSoC '26 issue needs exactly one difficulty label: \`LEVEL1\`, \`LEVEL2\`, or \`LEVEL3\`. A maintainer will add it after checking the scope.`
            });
