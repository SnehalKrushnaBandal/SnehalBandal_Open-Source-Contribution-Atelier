name: Merged PR Reward & Contributor Certificate

on:
  pull_request_target:
    types: [closed]

permissions:
  issues: write
  pull-requests: write
  contents: write

jobs:
  celebrate-merged-pr:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Post Contributor Certificate & Update Leaderboard
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const author = pr.user.login;

            // Count merged PRs from the API so pagination and search failures are explicit.
            let mergedCount = 0;
            let recentMergedCount = 0;
            try {
              const searchRes = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} is:pr is:merged author:${author}`
              });

              const mergedPRs = searchRes.data.items || [];
              mergedCount = searchRes.data.total_count;

              // Calculate 7-Day Hot Streak
              const sevenDaysAgo = new Date();
              sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);

              recentMergedCount = mergedPRs.filter(p => {
                const closedAt = new Date(p.closed_at || p.updated_at);
                return closedAt >= sevenDaysAgo;
              }).length;
            } catch (e) {
              core.setFailed(`Could not calculate contributor totals: ${e.message}`);
              return;
            }

            const isHotStreak = recentMergedCount >= 2;

            // Labels are often placed on the linked issue rather than copied to the PR.
            const normalizeLabel = value => String(value || '').trim().toUpperCase().replace(/[\s_-]+/g, '');
            const prLabels = (pr.labels || []).map(l => normalizeLabel(typeof l === 'string' ? l : l.name));
            const linkedIssueNumbers = [...new Set(
              `${pr.body || ''}\n${pr.title || ''}`.match(/(?:^|[^\w])#(\d+)/g)?.map(ref => Number(ref.replace(/\D/g, ''))) || []
            )];
            const linkedIssueLabels = [];
            for (const issueNumber of linkedIssueNumbers) {
              try {
                const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
                linkedIssueLabels.push(...(issue.data.labels || []).map(label => normalizeLabel(
                  typeof label === 'string' ? label : label.name
                )));
              } catch (e) {
                core.warning(`Could not read labels for linked issue #${issueNumber}: ${e.message}`);
              }
            }
            const allLabels = [...new Set([...prLabels, ...linkedIssueLabels])];
            const isNsoc = allLabels.includes('NSOC26') || /nsoc26/i.test(pr.title || '') || /nsoc26/i.test(pr.body || '');
            let nsocLevel = '';
            let earnedPoints = 25;

            if (allLabels.includes('LEVEL3') || /LEVEL3/i.test(pr.body || '') || /LEVEL3/i.test(pr.title || '')) {
              nsocLevel = 'LEVEL3';
              earnedPoints = 50;
            } else if (allLabels.includes('LEVEL2') || /LEVEL2/i.test(pr.body || '') || /LEVEL2/i.test(pr.title || '')) {
              nsocLevel = 'LEVEL2';
              earnedPoints = 25;
            } else if (allLabels.includes('LEVEL1') || /LEVEL1/i.test(pr.body || '') || /LEVEL1/i.test(pr.title || '')) {
              nsocLevel = 'LEVEL1';
              earnedPoints = 10;
            }

            // Determine Contributor Tier
            let tierName = '🥉 Bronze Contributor';

            if (mergedCount >= 10) {
              tierName = '💎 Diamond Contributor';
            } else if (mergedCount >= 5) {
              tierName = '🥇 Gold Contributor';
            } else if (mergedCount >= 3) {
              tierName = '🥈 Silver Contributor';
            }

            const certBody = [
              `Congratulations, @${author}!`,
              ``,
              `Your pull request #${pr.number} (${pr.title}) has been merged into main. Thank you for contributing to Open Source Contribution Atelier.`,
              ``,
              `You now have ${mergedCount} merged contribution${mergedCount === 1 ? '' : 's'} and are a ${tierName}.`,
              isNsoc
                ? `This contribution is verified for NSoC '26${nsocLevel ? ` at ${nsocLevel} difficulty` : ''} and is worth ${earnedPoints} points.`
                : '',
              isHotStreak
                ? `You are also on a 7-day hot streak with ${recentMergedCount} merged contributions.`
                : '',
              ``,
              `View the pull request: https://github.com/${owner}/${repo}/pull/${pr.number}`,
              `View the contributor leaderboard: https://github.com/${owner}/${repo}/blob/main/LEADERBOARD.md`,
              ``,
              `Keep learning, building, and helping other contributors.`
            ].filter(Boolean).join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: certBody
            });
            console.log(`Posted merged PR certificate for @${author} with Tier ${tierName}, Streak=${isHotStreak}, NSoC=${isNsoc}`);

            // Update LEADERBOARD.md
            try {
              let content = fs.readFileSync('LEADERBOARD.md', 'utf8');
              const today = new Date().toISOString().split('T')[0];
              const points = mergedCount * 25;
              const streakText = isHotStreak ? '⚡ Hot Streak' : 'Active';

              if (content.includes(`@${author}`)) {
                const newRow = `| 1 | @${author} | ${tierName} ${isHotStreak ? '⚡' : ''} | ${mergedCount} | ${points} | ${today} |`;
                const lines = content.split('\n');
                const rowIndex = lines.findIndex(line => line.startsWith(`| 1 | @${author} |`));
                if (rowIndex >= 0) lines[rowIndex] = newRow;
                content = lines.join('\n');
              } else {
                const newRow = `| 1 | @${author} | ${tierName} ${isHotStreak ? '⚡' : ''} | ${mergedCount} | ${points} | ${today} |\n`;
                content = content.replace('---', `${newRow}\n---`);
              }

              fs.writeFileSync('LEADERBOARD.md', content, 'utf8');
              console.log(`Updated LEADERBOARD.md for @${author}`);
            } catch (e) {
              console.warn(`Could not update LEADERBOARD.md:`, e);
            }

      - name: Commit & Push Leaderboard Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add LEADERBOARD.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: update contributor leaderboard [skip ci]" && git push)
