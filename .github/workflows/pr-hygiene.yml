name: PR Hygiene

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  issues: read
  contents: read

jobs:
  size-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const changedLines = pr.additions + pr.deletions;
            const body = pr.body || '';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100
            });
            const marker = '<!-- pr-hygiene -->';
            const previous = comments.find(comment => comment.body.includes(marker) && comment.user.type === 'Bot');
            const warnings = [];
            if (changedLines > 600) warnings.push(`This PR changes **${changedLines} lines**. Consider splitting it into smaller reviewable pieces.`);
            if (!/(?:fixes|closes|resolves)\\s+#\\d+/i.test(body)) warnings.push('Please link the issue this PR solves with `Fixes #<number>` so the project can track the work.');
            const message = warnings.length ? `${marker}\\n### 🧭 A small review nudge\\n\\n${warnings.map(w => `- ${w}`).join('\\n')}\\n\\nThese are reminders, not blockers.` : `${marker}\\n✅ PR hygiene looks good: linked issue and manageable change size.`;
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body: message });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: message });
            }
